[project]
name = "radiostats"
version = "0.1.0"
description = "Radio station play data analysis and scraping"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "beets>=1.7.0",
    "django>=5.2,<5.3",
    "django-countries>=7.5.0",
    "logbook>=1.8.0",
    "python-dateutil>=2.8.0",
    "pytz>=2024.1",
    "requests>=2.31.0",
    "simplejson>=3.19.0",
    "tqdm>=4.67.3",
    "psycopg2-binary>=2.9.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=5.0.0",
    "ruff",
]

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
ignore = [
    "ANN", # flake8-annotations
    "PTH", # flake8-use-pathlib
    "EM", # flake8-errmsg

    # ignore missing docs:
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203", # don't enforce blank line before class docstring
    "D213", # don't enforce newline after """ for multi-line docstring
    
    "C405", # don't ban calling set()
    "COM812", # don't enforce trailing commas
    "FBT001", "FBT002", # don't ban using booleans in function signatures, instead rely on FBT003
    "G004", # don't ban usage of f-strings in logging statements
    "N812", # don't ban "import types as T"
    "PLR0913", # don't limit number of function args
    "S101", # don't ban usage of assert
    "TRY003", # don't ban long exception messages
]

[tool.ruff.lint.per-file-ignores]
"test*.py" = [
    "PLR2004", # magic values (assert x == 4)
    "INP001", # missing __init__.py modules
    "S318", # using xml lib
    "ARG001", # unused function args (e.g. pytest fixtures)
]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["cls"] # allow usage of 'cls' instead of 'self' for class methods

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
